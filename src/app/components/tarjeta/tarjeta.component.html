<ion-card class="tarjeta">

  <div class="tarjeta-imagen" (click)="abrir()">
    <img [src]="restaurante.imagen" [alt]="restaurante.nombre">
  </div>

  <div class="tarjeta-texto">
    <h3>{{ restaurante.nombre }}</h3>
    <p>{{ restaurante.direccion }}</p>

    <div class="acciones">
      <ion-button size="small" (click)="abrir()">Ver productos</ion-button>

      <ion-button size="small" fill="clear" (click)="alternarFavorito()">
        <ion-icon slot="icon-only" [name]="esFavorito ? 'heart' : 'heart-outline'"></ion-icon>
      </ion-button>
    </div>
  </div>

</ion-card>
