<div class="formulario">

  <h2>Crear restaurante</h2>

  <ion-item class="campo" lines="none">
    <ion-input label="Nombre del restaurante" labelPlacement="floating" [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item class="campo" lines="none">
    <ion-input label="Dirección" labelPlacement="floating" [(ngModel)]="direccion"></ion-input>
  </ion-item>

  <ion-button class="boton" expand="block" (click)="crear()">Crear restaurante</ion-button>

</div>
