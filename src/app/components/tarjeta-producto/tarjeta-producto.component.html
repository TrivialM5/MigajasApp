<ion-card class="tarjeta-producto">

  <div class="producto-imagen">
    <img [src]="producto.imagen" [alt]="producto.nombre">
  </div>

  <div class="producto-texto">
    <h3>{{ producto.nombre }}</h3>
    <p>${{ producto.precio }}</p>

    <div class="cantidad">
      <ion-button size="small" fill="outline" [disabled]="cantidad === 0" (click)="menosUno()">-</ion-button>
      <span>{{ cantidad }}</span>
      <ion-button size="small" (click)="masUno()">+</ion-button>
    </div>
  </div>

</ion-card>
