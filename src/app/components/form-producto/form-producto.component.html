<div class="formulario">

  <h2>Agregar producto</h2>

  <ion-item class="campo" lines="none">
    <ion-input label="Nombre del plato" labelPlacement="floating" [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item class="campo" lines="none">
    <ion-input label="Precio" labelPlacement="floating" type="number" [(ngModel)]="precio"></ion-input>
  </ion-item>

  <ion-button class="boton" expand="block" (click)="crear()">Agregar producto</ion-button>

</div>
