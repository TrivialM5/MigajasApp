<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Restaurantes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="restaurantes-content">

  <div class="fondo-blur"></div>

  @if (mensajeError) {
    <p class="mensaje-error">{{ mensajeError }}</p>
  }

  <div class="grilla-restaurantes">
    @for (r of restaurantes; track r.id) {
      <app-tarjeta [restaurante]="r" [esFavorito]="favoritoService.esFavorito(r.id)" (seleccionado)="abrirRestaurante($event)" (favoritoCambio)="alternarFavorito($event)"></app-tarjeta>
    }
  </div>

</ion-content>
