<ion-content [fullscreen]="true" class="restaurantes-content">

  <div class="fondo-blur"></div>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">restaurante</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="grilla-restaurantes">
    @for (restaurante of restaurantes; track restaurante.id) {
      <app-tarjeta [restaurante]="restaurante"></app-tarjeta>
    }
  </div>
</ion-content>
