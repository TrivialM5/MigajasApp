<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  @if (favoritoService.restaurantes.length === 0) {
    <p class="ion-text-center ion-padding">Todavía no tienes restaurantes favoritos</p>
  }

  <div class="grilla">
    @for (r of favoritoService.restaurantes; track r.id) {
      <app-tarjeta
        [restaurante]="r"
        [esFavorito]="true"
        (seleccionado)="abrirRestaurante($event)"
        (favoritoCambio)="alternarFavorito($event)">
      </app-tarjeta>
    }
  </div>

</ion-content>
